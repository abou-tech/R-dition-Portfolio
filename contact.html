<!DOCTYPE html>
<html lang="fr">
<head>
	<title>Contact V1</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" type="image/png" href="./images/icons/favicon.ico"/>

	<link rel="stylesheet" href="css/style2.css">
</head>
<body>

	<div class="contact1">
		<div class="container-contact1">
			<div class="contact1-pic js-tilt" data-tilt>
				<img src="images/img-01.png" alt="IMG">
			</div>

			<form class="contact1-form validate-form">
				<span class="contact1-form-title">
					Contactez-moi
				</span>

				<div class="wrap-input1 validate-input" data-validate = "Name is required">
					<input class="input1" type="text" name="name" placeholder="Nom">
					<span class="shadow-input1"></span>
				</div>
				<div class="wrap-input1 validate-input" data-validate = "Name is required">
					<input class="input1" type="text" name="surname" placeholder="Prénom">
					<span class="shadow-input1"></span>
				</div>

				<div class="wrap-input1 validate-input" data-validate = "Valid email is required: ex@abc.xyz">
					<input class="input1" type="text" name="email" placeholder="Email">
					<span class="shadow-input1"></span>
				</div>

				<div class="wrap-input1 validate-input" data-validate = "Subject is required">
					<input class="input1" type="text" name="subject" placeholder="Objet">
					<span class="shadow-input1"></span>
				</div>

				<div class="wrap-input1 validate-input" data-validate = "Message is required">
					<textarea class="input1" name="message" placeholder="Message"></textarea>
					<span class="shadow-input1"></span>
				</div>

				<div class="container-contact1-form-btn">
					<button class="contact1-form-btn">
						<span>
							Envoyer 
							<i class="fa fa-long-arrow-right" aria-hidden="true"><svg class="cl-icon" viewBox="0 0 1792 1792" style="vertical-align:-0.1429em" aria-hidden="true" focusable="false"><g transform="translate(0,1536) scale(1,-1)"><path d="M1728 643Q1728 629 1718 619L1334 265Q1318 251 1299 259Q1280 268 1280 288V512H32Q18 512 9.0 521.0Q0 530 0 544V736Q0 750 9.0 759.0Q18 768 32 768H1280V992Q1280 1013 1299.0 1021.0Q1318 1029 1334 1016L1718 666Q1728 656 1728 643Z"/></g></svg></i>
						</span>
					</button>
				</div>
			</form>
		</div>
	</div>

		<script src="./js/snippet.js"></script>
</body>
</html>
